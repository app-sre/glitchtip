[project]
name = "glitchtip"
version = "0.1.0"
description = "GlitchTip"
authors = [{ name = "AppSRE", email = "sd-app-sre@redhat.com" }]
license = { text = "MIT License" }
readme = "README.md"
requires-python = "~= 3.14.0"
dependencies = [
    # we want to use the latest!!! version of qontract-reconcile
    "qontract-reconcile>=0.10.1rc1177",
    "pytest ~=9.0",
    "pytest-order ~=1.5.0",
]

[project.urls]
homepage = "https://github.com/app-sre/glitchtip"
repository = "https://github.com/app-sre/glitchtip"
documentation = "https://github.com/app-sre/glitchtip"

[dependency-groups]
dev = [
    # allow updates for minor versions
    "ruff==0.16.5",
    "mypy ~=2.1",
    "django>=5.1.3",
    "django-stubs>=5.1.1",
]

# Ruff configuration
[tool.ruff]
line-length = 88
# Without this, `uv run ruff check` inside the Docker `test` stage (see
# Dockerfile) lints the whole vendored GlitchTip source tree copied into
# $APP_ROOT, not just this repo's own files -- restrict to what we actually
# own.
include = ["acceptance/*.py", "appsre/*.py", "django-tests/*.py", "**/pyproject.toml"]
src = ["acceptance", "appsre", "django-tests"]
extend-exclude = [
    # exclude some common cache and tmp directories
    ".local",
    ".cache",
    "tmp",
]
fix = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "CPY",                               # Missing copyright header
    "undocumented-public-module",        # Missing docstring in public module
    "undocumented-public-class",         # Missing docstring in public class
    "undocumented-public-method",        # Missing docstring in public method
    "undocumented-public-function",      # Missing docstring in public function
    "undocumented-public-package",       # Missing docstring in public package
    "undocumented-public-init",          # Missing docstring in __init__
    "incorrect-blank-line-before-class", # 1 blank line required before class docstring
    "blank-line-before-class",           # No blank lines allowed before class docstring
    "multi-line-summary-first-line",     # multi-line-summary-first-line
    "multi-line-summary-second-line",    # multi-line-summary-second-line
    "D4",                                # Doc string style
    "line-too-long",                     # Line too long
    "too-many-public-methods",           # Too many public methods
    "too-many-arguments",                # Too many arguments
    "too-many-positional-arguments",     # Too many positional arguments
    "assert",                            # Use of assert detected. Pytest uses assert
    "suspicious-subprocess-import",      # subprocess import
    "try-consider-else",                 # try-consider-else
    "print",
    "f-string-in-exception",
    "raise-vanilla-class",
    "raise-vanilla-args",
    "unused-function-argument",
    "module-import-not-at-top-of-file",  # top-level import not at top of file
    # pydoclint
    "DOC",
    # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "Q",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "single-line-implicit-string-concatenation",
]

[tool.ruff.format]
preview = true

[tool.ruff.lint.isort]
known-first-party = ["acceptance", "appsre"]

# Mypy configuration
[tool.mypy]
files = ["appsre", "acceptance", "django-tests"]
plugins = ["pydantic.mypy"]
enable_error_code = ["truthy-bool", "redundant-expr"]
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# Below are all of the packages that don't implement stub packages. Mypy will throw an error if we don't ignore the
# missing imports. See: https://mypy.readthedocs.io/en/stable/running_mypy.html#missing-imports
module = ["reconcile.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# glitchtip-backend's own Django app code -- only present inside the built
# image (see Dockerfile's `test` stage), not installed in this repo's venv.
# Scoped to only what django-tests/ actually imports, rather than all of
# apps.* -- a blanket apps.* ignore would mask real type errors elsewhere
# under appsre/ (e.g. apps.api_tokens) that only surface when that code
# actually resolves, inside the real Docker build.
module = [
    "apps.alerts.*",
    "apps.issue_events.*",
    "apps.organizations_ext.*",
    "apps.projects.*",
]
ignore_missing_imports = true
